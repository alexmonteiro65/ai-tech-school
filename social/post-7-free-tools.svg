<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Free AI tools you don't know about</title>
  <desc id="desc">Instagram post listing four genuinely free AI tools: Gemini Notebook, Google AI Studio, Hugging Face Spaces, and GitHub Copilot's free tier.</desc>

  <defs>
    <radialGradient id="glowFT" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#glowFT)"/>

  <text x="540" y="115" text-anchor="middle" fill="#3b82f6" font-size="26" font-weight="700" letter-spacing="3">FREE &amp; UNDERRATED</text>
  <text x="540" y="180" text-anchor="middle" fill="#f4f6fb" font-size="48" font-weight="800">4 free AI tools</text>
  <text x="540" y="225" text-anchor="middle" fill="#9aa3b8" font-size="27">you're probably not using yet</text>

  <!-- Tool 1 -->
  <g>
    <rect x="90" y="280" width="900" height="165" rx="20" fill="#161a26" stroke="#262c3d" stroke-width="2"/>
    <text x="130" y="335" fill="#3b82f6" font-size="30" font-weight="800">Gemini Notebook</text>
    <text x="130" y="370" fill="#9aa3b8" font-size="22">Formerly NotebookLM — upload sources, get answers grounded in them.</text>
    <text x="130" y="400" fill="#656d82" font-size="19">Free: 100 notebooks, 50 sources each, 50 questions a day</text>
  </g>

  <!-- Tool 2 -->
  <g>
    <rect x="90" y="465" width="900" height="165" rx="20" fill="#161a26" stroke="#262c3d" stroke-width="2"/>
    <text x="130" y="520" fill="#8b5cf6" font-size="30" font-weight="800">Google AI Studio</text>
    <text x="130" y="555" fill="#9aa3b8" font-size="22">A free playground to prototype with Gemini models using plain prompts.</text>
    <text x="130" y="585" fill="#656d82" font-size="19">Free access in most regions</text>
  </g>

  <!-- Tool 3 -->
  <g>
    <rect x="90" y="650" width="900" height="165" rx="20" fill="#161a26" stroke="#262c3d" stroke-width="2"/>
    <text x="130" y="705" fill="#38bdf8" font-size="30" font-weight="800">Hugging Face Spaces</text>
    <text x="130" y="740" fill="#9aa3b8" font-size="22">Free hosting to run and share open-source AI models and demos.</text>
    <text x="130" y="770" fill="#656d82" font-size="19">Free tier, no credit card</text>
  </g>

  <!-- Tool 4 -->
  <g>
    <rect x="90" y="835" width="900" height="165" rx="20" fill="#161a26" stroke="#34d399" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="90" y="835" width="900" height="165" rx="20" fill="#34d399" fill-opacity="0.05"/>
    <text x="130" y="890" fill="#34d399" font-size="30" font-weight="800">GitHub Copilot (free tier)</text>
    <text x="130" y="925" fill="#9aa3b8" font-size="22">Free tier available for individual accounts and verified students.</text>
    <text x="130" y="955" fill="#656d82" font-size="19">Check current eligibility on github.com</text>
  </g>

  <text x="540" y="1050" text-anchor="middle" fill="#656d82" font-size="24" font-weight="700" letter-spacing="1">AI TECH SCHOOL</text>
</svg>
