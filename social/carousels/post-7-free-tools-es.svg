<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Free AI tools you don't know about</title>
  <desc id="desc">Instagram post listing four genuinely free AI tools.</desc>
  <defs>
    <radialGradient id="glowFT" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#182238"/><stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#glowFT)"/>
  <text x="540" y="115" text-anchor="middle" fill="#3b82f6" font-size="24" font-weight="700" letter-spacing="2">GRATIS Y SUBVALORADAS</text>
  <text x="540" y="180" text-anchor="middle" fill="#f4f6fb" font-size="44" font-weight="800">4 herramientas de IA gratis</text>
  <text x="540" y="225" text-anchor="middle" fill="#9aa3b8" font-size="25">que probablemente no estés usando</text>
  <g>
    <rect x="90" y="280" width="900" height="165" rx="20" fill="#161a26" stroke="#262c3d" stroke-width="2"/>
    <text x="130" y="335" fill="#3b82f6" font-size="28" font-weight="800">Gemini Notebook</text>
    <text x="130" y="370" fill="#9aa3b8" font-size="20">Antes NotebookLM — sube tus fuentes y recibe respuestas basadas en ellas.</text>
    <text x="130" y="400" fill="#656d82" font-size="17">Gratis: 100 notebooks, 50 fuentes cada uno, 50 preguntas al día</text>
  </g>
  <g>
    <rect x="90" y="465" width="900" height="165" rx="20" fill="#161a26" stroke="#262c3d" stroke-width="2"/>
    <text x="130" y="520" fill="#8b5cf6" font-size="28" font-weight="800">Google AI Studio</text>
    <text x="130" y="555" fill="#9aa3b8" font-size="20">Un espacio gratuito para prototipar con modelos Gemini usando prompts simples.</text>
    <text x="130" y="585" fill="#656d82" font-size="17">Acceso gratuito en la mayoría de regiones</text>
  </g>
  <g>
    <rect x="90" y="650" width="900" height="165" rx="20" fill="#161a26" stroke="#262c3d" stroke-width="2"/>
    <text x="130" y="705" fill="#38bdf8" font-size="28" font-weight="800">Hugging Face Spaces</text>
    <text x="130" y="740" fill="#9aa3b8" font-size="20">Alojamiento gratis para correr y compartir modelos y demos de IA de código abierto.</text>
    <text x="130" y="770" fill="#656d82" font-size="17">Plan gratis, sin tarjeta de crédito</text>
  </g>
  <g>
    <rect x="90" y="835" width="900" height="165" rx="20" fill="#161a26" stroke="#34d399" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="90" y="835" width="900" height="165" rx="20" fill="#34d399" fill-opacity="0.05"/>
    <text x="130" y="890" fill="#34d399" font-size="28" font-weight="800">GitHub Copilot (plan gratis)</text>
    <text x="130" y="925" fill="#9aa3b8" font-size="20">Plan gratis disponible para cuentas individuales y estudiantes verificados.</text>
    <text x="130" y="955" fill="#656d82" font-size="17">Revisa la elegibilidad actual en github.com</text>
  </g>
  <text x="540" y="1050" text-anchor="middle" fill="#656d82" font-size="24" font-weight="700" letter-spacing="1">AI TECH SCHOOL</text>
</svg>
