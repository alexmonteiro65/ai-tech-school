<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">What is an AI Agent?</title>
  <desc id="desc">Instagram post explaining AI agents as a loop of observe, think, and act, repeating largely without a human approving every step.</desc>

  <defs>
    <radialGradient id="glowAG" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#241a3d"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#glowAG)"/>

  <text x="540" y="110" text-anchor="middle" fill="#3b82f6" font-size="26" font-weight="700" letter-spacing="3">VISUAL EXPLAINER</text>
  <text x="540" y="175" text-anchor="middle" fill="#f4f6fb" font-size="52" font-weight="800">What is an AI Agent?</text>
  <text x="540" y="215" text-anchor="middle" fill="#9aa3b8" font-size="27">Not just a chatbot — a loop.</text>

  <!-- circular loop diagram -->
  <circle cx="540" cy="560" r="260" fill="none" stroke="#262c3d" stroke-width="3"/>

  <!-- Observe node (top) -->
  <circle cx="540" cy="300" r="80" fill="#161a26" stroke="#3b82f6" stroke-width="3"/>
  <text x="540" y="292" text-anchor="middle" fill="#3b82f6" font-size="24" font-weight="800">OBSERVE</text>
  <text x="540" y="318" text-anchor="middle" fill="#9aa3b8" font-size="16">gather info</text>

  <!-- Think node (bottom right) -->
  <circle cx="765" cy="710" r="80" fill="#161a26" stroke="#8b5cf6" stroke-width="3"/>
  <text x="765" y="702" text-anchor="middle" fill="#8b5cf6" font-size="24" font-weight="800">THINK</text>
  <text x="765" y="728" text-anchor="middle" fill="#9aa3b8" font-size="16">decide next step</text>

  <!-- Act node (bottom left) -->
  <circle cx="315" cy="710" r="80" fill="#161a26" stroke="#34d399" stroke-width="3"/>
  <text x="315" y="702" text-anchor="middle" fill="#34d399" font-size="24" font-weight="800">ACT</text>
  <text x="315" y="728" text-anchor="middle" fill="#9aa3b8" font-size="16">use a tool</text>

  <!-- arrows around the loop -->
  <path d="M 610 340 A 260 260 0 0 1 740 635" fill="none" stroke="#656d82" stroke-width="3" marker-end="url(#agentArrow)"/>
  <path d="M 690 760 A 260 260 0 0 1 390 760" fill="none" stroke="#656d82" stroke-width="3" marker-end="url(#agentArrow)"/>
  <path d="M 340 635 A 260 260 0 0 1 470 340" fill="none" stroke="#656d82" stroke-width="3" marker-end="url(#agentArrow)"/>

  <defs>
    <marker id="agentArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#656d82"/>
    </marker>
  </defs>

  <text x="540" y="880" text-anchor="middle" fill="#9aa3b8" font-size="24">Repeats until the goal is done —</text>
  <text x="540" y="915" text-anchor="middle" fill="#9aa3b8" font-size="24">largely without a human approving every step.</text>

  <text x="540" y="1010" text-anchor="middle" fill="#656d82" font-size="26" font-weight="700" letter-spacing="1">AI TECH SCHOOL</text>
</svg>
