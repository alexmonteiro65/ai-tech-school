<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">AI Tech School — Three Skill Paths</title>
  <desc id="desc">Instagram post showing the three AI Tech School skill paths: Beginner, Intermediate, and Expert, each with a short description.</desc>

  <defs>
    <radialGradient id="glow2" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#1a1530"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#glow2)"/>

  <text x="540" y="120" text-anchor="middle" fill="#3b82f6" font-size="26" font-weight="700" letter-spacing="3">CHOOSE YOUR PATH</text>
  <text x="540" y="180" text-anchor="middle" fill="#f4f6fb" font-size="52" font-weight="800">Three levels. Pick where you are.</text>

  <!-- Beginner card -->
  <g>
    <rect x="90" y="260" width="900" height="220" rx="24" fill="#161a26" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="90" y="260" width="900" height="220" rx="24" fill="#34d399" fill-opacity="0.06"/>
    <text x="130" y="330" fill="#34d399" font-size="24" font-weight="800" letter-spacing="2">01 · BEGINNER</text>
    <text x="130" y="380" fill="#f4f6fb" font-size="36" font-weight="800">Never touched Claude before</text>
    <text x="130" y="425" fill="#9aa3b8" font-size="26">What Claude is, how to prompt it, what an API does.</text>
  </g>

  <!-- Intermediate card -->
  <g>
    <rect x="90" y="500" width="900" height="220" rx="24" fill="#161a26" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="90" y="500" width="900" height="220" rx="24" fill="#38bdf8" fill-opacity="0.06"/>
    <text x="130" y="570" fill="#38bdf8" font-size="24" font-weight="800" letter-spacing="2">02 · INTERMEDIATE</text>
    <text x="130" y="620" fill="#f4f6fb" font-size="36" font-weight="800">Ready to start building</text>
    <text x="130" y="665" fill="#9aa3b8" font-size="26">Install Claude Code, connect MCP, automate a task.</text>
  </g>

  <!-- Expert card -->
  <g>
    <rect x="90" y="740" width="900" height="220" rx="24" fill="#161a26" stroke="#c084fc" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="90" y="740" width="900" height="220" rx="24" fill="#c084fc" fill-opacity="0.06"/>
    <text x="130" y="810" fill="#c084fc" font-size="24" font-weight="800" letter-spacing="2">03 · EXPERT</text>
    <text x="130" y="860" fill="#f4f6fb" font-size="36" font-weight="800">Building AI professionally</text>
    <text x="130" y="905" fill="#9aa3b8" font-size="26">Autonomous agents, 10+ connected tools, real deployment.</text>
  </g>

  <text x="540" y="1020" text-anchor="middle" fill="#656d82" font-size="26" font-weight="700" letter-spacing="1">AI TECH SCHOOL</text>
</svg>
