<svg viewBox="0 0 1000 1020" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The AI Universe</title>
  <desc id="desc">A layered diagram showing Claude at the center, surrounded by how you reach it (prompts and chat), how software reaches it (the API), how it reaches tools (MCP), the connectors that plug into MCP (GitHub, Slack, Gmail, Notion, Calendar, Composio), and an outer orbit of autonomous agents that use all of the above.</desc>

  <defs>
    <linearGradient id="claudeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#241a3d"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
    <filter id="coreGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="1020" fill="url(#bgGlow)"/>

  <!-- Faint starfield, thematic with "universe" -->
  <g fill="#f4f6fb">
    <circle cx="70" cy="90" r="1.6" fill-opacity="0.5"/>
    <circle cx="130" cy="150" r="1" fill-opacity="0.35"/>
    <circle cx="920" cy="110" r="1.6" fill-opacity="0.45"/>
    <circle cx="860" cy="60" r="1" fill-opacity="0.3"/>
    <circle cx="945" cy="200" r="1.2" fill-opacity="0.4"/>
    <circle cx="55" cy="230" r="1.2" fill-opacity="0.4"/>
    <circle cx="45" cy="900" r="1.4" fill-opacity="0.4"/>
    <circle cx="950" cy="920" r="1.4" fill-opacity="0.4"/>
    <circle cx="900" cy="960" r="1" fill-opacity="0.3"/>
    <circle cx="80" cy="960" r="1" fill-opacity="0.3"/>
  </g>

  <!-- Title -->
  <text x="500" y="52" text-anchor="middle" fill="#f4f6fb" font-size="34" font-weight="800" letter-spacing="1">THE AI UNIVERSE</text>
  <text x="500" y="82" text-anchor="middle" fill="#9aa3b8" font-size="16">Center = simplest and most direct. Edge = more autonomous.</text>

  <!-- ===================== SPOKES (core to connector chips) ===================== -->
  <g stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round">
    <line x1="500" y1="418" x2="500" y2="180"/>
    <line x1="554" y1="447" x2="760" y2="330"/>
    <line x1="554" y1="513" x2="760" y2="630"/>
    <line x1="500" y1="542" x2="500" y2="780"/>
    <line x1="446" y1="513" x2="240" y2="630"/>
    <line x1="446" y1="447" x2="240" y2="330"/>
  </g>

  <!-- ===================== RINGS ===================== -->
  <g stroke-width="2" fill-rule="evenodd">
    <!-- Connectors ring (outermost filled ring) -->
    <circle cx="500" cy="480" r="300" fill="#38bdf8" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.55"/>
    <!-- MCP ring -->
    <circle cx="500" cy="480" r="230" fill="#8b5cf6" fill-opacity="0.09" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <!-- API ring -->
    <circle cx="500" cy="480" r="165" fill="#3b82f6" fill-opacity="0.11" stroke="#3b82f6" stroke-opacity="0.65"/>
    <!-- Prompts & Chat ring -->
    <circle cx="500" cy="480" r="100" fill="#1b2030" fill-opacity="0.95" stroke="#9aa3b8" stroke-opacity="0.5"/>
  </g>

  <!-- Agent orbit (dashed, outside all rings) -->
  <circle cx="500" cy="480" r="350" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="3 10" stroke-linecap="round"/>

  <!-- Orbiting agent satellites -->
  <g>
    <circle cx="500" cy="130" r="9" fill="#c084fc"/>
    <circle cx="786.7" cy="680.9" r="7" fill="#c084fc" fill-opacity="0.7"/>
    <circle cx="213.3" cy="680.9" r="7" fill="#c084fc" fill-opacity="0.7"/>
    <!-- loop motion arrow near the top satellite -->
    <path d="M 475 118 A 30 30 0 0 1 525 118" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  </g>

  <!-- ===================== CLAUDE CORE ===================== -->
  <g filter="url(#coreGlow)">
    <circle cx="500" cy="480" r="62" fill="url(#claudeGradient)"/>
  </g>
  <text x="500" y="473" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">CLAUDE</text>
  <text x="500" y="495" text-anchor="middle" fill="#ffffff" font-size="12" fill-opacity="0.85">the model</text>

  <!-- ===================== CONNECTOR CHIPS ===================== -->
  <g font-size="18" font-weight="700" fill="#f4f6fb" filter="url(#chipShadow)">
    <!-- GitHub: top -->
    <rect x="425" y="158" width="150" height="44" rx="22" fill="#10131c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="500" y="186" text-anchor="middle">GitHub</text>

    <!-- Slack: upper right -->
    <rect x="685" y="308" width="150" height="44" rx="22" fill="#10131c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="760" y="336" text-anchor="middle">Slack</text>

    <!-- Gmail: lower right -->
    <rect x="685" y="608" width="150" height="44" rx="22" fill="#10131c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="760" y="636" text-anchor="middle">Gmail</text>

    <!-- Notion: bottom -->
    <rect x="425" y="758" width="150" height="44" rx="22" fill="#10131c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="500" y="786" text-anchor="middle">Notion</text>

    <!-- Calendar: lower left -->
    <rect x="165" y="608" width="150" height="44" rx="22" fill="#10131c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="240" y="636" text-anchor="middle">Calendar</text>

    <!-- Composio: upper left -->
    <rect x="165" y="308" width="150" height="44" rx="22" fill="#10131c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="240" y="336" text-anchor="middle">Composio</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="15">
    <!-- row 1 -->
    <circle cx="60" cy="892" r="9" fill="url(#claudeGradient)"/>
    <text x="80" y="887" fill="#f4f6fb" font-weight="800" font-size="16">Claude</text>
    <text x="80" y="908" fill="#9aa3b8" font-size="13">The model that reasons and responds.</text>

    <circle cx="400" cy="892" r="9" fill="#9aa3b8"/>
    <text x="420" y="887" fill="#f4f6fb" font-weight="800" font-size="16">Prompts &amp; Chat</text>
    <text x="420" y="908" fill="#9aa3b8" font-size="13">Talking to Claude directly.</text>

    <circle cx="740" cy="892" r="9" fill="#3b82f6"/>
    <text x="760" y="887" fill="#f4f6fb" font-weight="800" font-size="16">API</text>
    <text x="760" y="908" fill="#9aa3b8" font-size="13">How software talks to Claude.</text>

    <!-- row 2 -->
    <circle cx="60" cy="952" r="9" fill="#8b5cf6"/>
    <text x="80" y="947" fill="#f4f6fb" font-weight="800" font-size="16">MCP</text>
    <text x="80" y="968" fill="#9aa3b8" font-size="13">The standard linking Claude to tools.</text>

    <circle cx="400" cy="952" r="9" fill="#38bdf8"/>
    <text x="420" y="947" fill="#f4f6fb" font-weight="800" font-size="16">Connectors</text>
    <text x="420" y="968" fill="#9aa3b8" font-size="13">The six integrations shown above.</text>

    <circle cx="740" cy="952" r="9" fill="#c084fc"/>
    <text x="760" y="947" fill="#f4f6fb" font-weight="800" font-size="16">Agents</text>
    <text x="760" y="968" fill="#9aa3b8" font-size="13">Loops that act on their own.</text>
  </g>

  <text x="500" y="1005" text-anchor="middle" fill="#656d82" font-size="13">AI Tech School — how the pieces of the AI ecosystem fit together</text>
</svg>
